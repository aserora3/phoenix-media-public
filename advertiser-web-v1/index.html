<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香水自販機サイネージ｜広告申込</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:920px;margin:auto;padding:20px;background:#f6f6f6;color:#111}.card{background:#fff;padding:20px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input,select{font:inherit;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{cursor:pointer;font-weight:700}.hidden{display:none}.ok{padding:10px;background:#eef9ee;border-radius:10px}.muted{color:#666;font-size:.92rem}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>香水自販機サイネージ広告</h1><p class="muted">広告主向け申込・入金・入稿・管理反映の動作確認版です。実決済はまだ接続していません。</p><div class="card"><h2>1. プラン選択</h2><select id="plan"><option value="7日|100000">7日 100,000円</option><option value="2週間|200000">2週間 200,000円</option><option value="1ヶ月|350000">1ヶ月 350,000円</option><option value="3ヶ月|945000">3ヶ月 945,000円</option><option value="6ヶ月|1785000">6ヶ月 1,785,000円</option><option value="12ヶ月|3360000">12ヶ月 3,360,000円</option></select><label>会社名<input id="company"></label><label>担当者名<input id="person"></label><label>メール<input id="email" type="email"></label><label><input id="agency" type="checkbox" style="width:auto"> 代理店からの紹介</label><button onclick="apply()">申込内容を確定</button></div><div id="payCard" class="card hidden"><h2>2. 入金確認</h2><p id="summary"></p><button onclick="paid()">テスト入金完了にする</button><p class="muted">本番では決済サービスのWebhookで自動反映する想定です。</p></div><div id="uploadCard" class="card hidden"><h2>3. 広告素材を入稿</h2><input id="asset" type="file" accept="video/mp4,image/*"><button onclick="upload()">入稿する</button></div><div id="statusCard" class="card hidden"><h2>4. ステータス</h2><div id="status" class="ok"></div></div><div class="card"><h2>管理画面（テスト）</h2><button onclick="renderAdmin()">最新申込を表示</button><div id="admin"></div><p class="muted">代理店25%や設置場所20%などの収益情報は顧客画面には表示せず、管理画面だけで計算します。</p></div><script>const KEY='perfume_advertiser_v1';let d=JSON.parse(localStorage.getItem(KEY)||'{}');function save(){localStorage.setItem(KEY,JSON.stringify(d))}function apply(){const [label,price]=plan.value.split('|');if(!company.value||!email.value)return alert('会社名とメールを入力してください');d={company:company.value,person:person.value,email:email.value,plan:label,price:+price,agency:agency.checked,status:'申込済み・入金待ち',created:new Date().toISOString()};save();summary.textContent=`${d.company} / ${d.plan} / ${d.price.toLocaleString()}円`;payCard.classList.remove('hidden');showStatus()}function paid(){d.status='入金済み・入稿待ち';d.paidAt=new Date().toISOString();save();uploadCard.classList.remove('hidden');showStatus()}function upload(){const f=asset.files[0];if(!f)return alert('ファイルを選択してください');d.asset={name:f.name,size:f.size,type:f.type};d.status='入稿済み・審査待ち';d.uploadedAt=new Date().toISOString();save();showStatus();renderAdmin()}function showStatus(){statusCard.classList.remove('hidden');status.textContent=d.status||'未申込'}function renderAdmin(){if(!d.company){admin.textContent='申込なし';return}const tax=Math.round(d.price*.1),gross=d.price+tax,card=Math.round(gross*.036),agencyFee=d.agency?Math.round(d.price*.25):0,location=Math.round((d.price-agencyFee)*.20),net=d.price-agencyFee-location-card;admin.innerHTML=`<table><tr><th>会社</th><td>${d.company}</td></tr><tr><th>プラン</th><td>${d.plan}</td></tr><tr><th>状態</th><td>${d.status}</td></tr><tr><th>税抜売上</th><td>${d.price.toLocaleString()}円</td></tr><tr><th>消費税</th><td>${tax.toLocaleString()}円</td></tr><tr><th>決済手数料(仮3.6%)</th><td>${card.toLocaleString()}円</td></tr><tr><th>代理店手数料25%</th><td>${agencyFee.toLocaleString()}円</td></tr><tr><th>設置場所20%</th><td>${location.toLocaleString()}円</td></tr><tr><th>概算当社残</th><td>${net.toLocaleString()}円</td></tr><tr><th>入稿</th><td>${d.asset?d.asset.name:'未入稿'}</td></tr></table>`}if(d.company){payCard.classList.remove('hidden');if(d.paidAt)uploadCard.classList.remove('hidden');showStatus()}</script></body></html>
